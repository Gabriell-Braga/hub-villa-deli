name = "hub-logistico"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ===========================================================================
# AMBIENTES
#
#   npx wrangler dev                      -> dev  (este bloco [vars])
#   npx wrangler dev --env hml            -> hml
#   npx wrangler deploy --env hml         -> publica o worker de homologação
#   npx wrangler deploy --env producao    -> publica o de produção
#
# Cada ambiente tem seus PRÓPRIOS segredos:
#   npx wrangler secret put UBER_CLIENT_ID --env hml
#   npx wrangler secret put UBER_CLIENT_ID --env producao
#
# Em dev os segredos ficam em worker/.dev.vars (git-ignorado).
# ===========================================================================

# ---------------------------------------------------------------------------
# D1 — estado dos pedidos (ver schema.sql para o porquê de não ser KV).
# Crie com:  npx wrangler d1 create hub-logistico
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "hub-logistico"
database_id = "PREENCHER_COM_O_ID_DO_D1"

# ---------------------------------------------------------------------------
# KV — só cache (token OAuth2 + geocodificação).
# Crie com:  npx wrangler kv namespace create HUB_KV
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "HUB_KV"
id = "PREENCHER_COM_O_ID_DO_KV"          # produção
preview_id = "PREENCHER_COM_O_PREVIEW_ID" # wrangler dev

# Dois horários:
#   */5  reprocessa eventos do Cardápio Web que falharam na primeira tentativa.
#        Um pedido preso é um pedido que a loja não vê — não pode esperar horas.
#   0 4  limpeza diária dos pedidos antigos (D1 não expira sozinho como o KV).
[triggers]
crons = ["*/5 * * * *", "0 4 * * *"]

# ===========================================================================
# VARIÁVEIS — DEV (padrão do `npx wrangler dev`)
# Nada sensível aqui. Segredos vão em .dev.vars / wrangler secret.
# ===========================================================================
[vars]
AMBIENTE = "dev"

# --- TRAVA DE PROVEDORES ---------------------------------------------------
# Quem entra na cotação e pode receber despacho. Lista separada por vírgula.
#   "uber"                    -> só Uber Direct
#   "uber,motoboy"            -> Uber + motoboy próprio   (configuração atual)
#   "uber,ifood,99,motoboy"   -> todos
# Vazio = usa o padrão de src/config/provedores.ts.
PROVEDORES_ATIVOS = "uber,motoboy"

# Origens liberadas no CORS (separadas por vírgula).
PAINEL_ORIGIN = "http://localhost:3000"

# --- Restaurante (origem das entregas) -------------------------------------
# Coordenada da PORTA da loja, informada pelo cliente em 04/08/2026. É o centro
# de todos os anéis de preço do motoboy próprio e o ponto de coleta do Uber.
RESTAURANTE_NOME = "Villa Deli"
RESTAURANTE_CEP = "34006-086"
RESTAURANTE_LAT = "-19.978452"
RESTAURANTE_LNG = "-43.932128"
# Formato E.164 obrigatório: o Uber recusa a cotação sem código de país, e é
# o número que o entregador liga na coleta.
RESTAURANTE_TELEFONE = "+5531984428765"

# TELEFONE DE TESTE — substitui o do cliente em TODO pedido marcado como
# teste. O Uber manda SMS de acompanhamento para o número do destino: sem
# esta troca, um teste nosso vira mensagem estranha no celular de um cliente
# real, e quem está testando não recebe aviso nenhum.
TELEFONE_TESTE = "+5531973065499"

# --- Cardápio Web ----------------------------------------------------------
# CARDAPIO_WEB_HEADER: header em que o Cardápio Web manda o token do webhook.
# Hoje é X-Webhook-Token. O valor do token em si vai no segredo WEBHOOK_SECRET.
#
# CARDAPIO_WEB_BASE_URL vazio = escolhe sozinho pelo AMBIENTE:
#   producao -> https://integracao.cardapioweb.com
#   dev/hml  -> https://integracao.sandbox.cardapioweb.com
CARDAPIO_WEB_HEADER = "x-webhook-token"
CARDAPIO_WEB_BASE_URL = ""
CARDAPIO_WEB_MERCHANT_ID = "14875"

# --- Uber Direct: PRODUÇÃO -------------------------------------------------
UBER_BASE_URL = "https://api.uber.com"
UBER_AUTH_URL = "https://auth.uber.com/oauth/v2/token"
# Escopos OAuth2. Pedir um escopo que a aplicacao NAO tem derruba o token
# inteiro (invalid_scope). Quando o Uber liberar entregas para a sua
# aplicacao, troque para: "direct.organizations eats.deliveries"
UBER_SCOPE = "direct.organizations"
UBER_CUSTOMER_ID = "551fca94-17d0-4acf-a3f8-05d93a0abe6a"

# --- Uber Direct: TESTE (sandbox) ------------------------------------------
# Usados quando o MODO DE OPERAÇÃO é "teste" — trocado na tela de
# Configurações do painel, sem deploy. CONFIRME o host de sandbox com o seu
# gerente de conta Uber: ele varia por contrato.
# A conta de teste tem o produto de entregas liberado; a de produção ainda não.
UBER_SCOPE_TESTE = "direct.organizations eats.deliveries"
UBER_BASE_URL_TESTE = "https://sandbox-api.uber.com"
UBER_CUSTOMER_ID_TESTE = "c1cc78e9-6147-5db8-82be-1b0f45446e09"

# --- iFood / 99 (desligados na trava por enquanto) -------------------------
IFOOD_BASE_URL = "https://merchant-api.ifood.com.br"
IFOOD_BASE_URL_TESTE = "https://merchant-api.ifood.com.br"
IFOOD_MERCHANT_ID = ""
NOVA99_BASE_URL = "https://api.99app.com"
NOVA99_BASE_URL_TESTE = "https://api.99app.com"
NOVA99_AUTH_URL = "https://api.99app.com/oauth/token"

# --- Motoboy próprio -------------------------------------------------------
# A tabela de preço por faixa de raio fica em src/config/faixas-motoboy.ts
# (espelha as "Regiões" do Cardápio Web). Não há variável de ambiente aqui.


# ===========================================================================
# HOMOLOGAÇÃO  —  npx wrangler dev --env hml  |  deploy --env hml
# ===========================================================================
[env.hml]
name = "hub-logistico-hml"

[[env.hml.d1_databases]]
binding = "DB"
database_name = "hub-logistico-hml"
database_id = "9d872b31-aaa0-49da-8d8b-9a80e3002113"

[[env.hml.kv_namespaces]]
binding = "HUB_KV"
id = "f9bcfa095d4849158d18df35f5225614"

[env.hml.triggers]
crons = ["*/5 * * * *", "0 4 * * *"]

[env.hml.vars]
AMBIENTE = "hml"
PROVEDORES_ATIVOS = "uber,motoboy"
PAINEL_ORIGIN = "https://hub-cardapio-web.vercel.app"

RESTAURANTE_NOME = "Villa Deli"
RESTAURANTE_CEP = "34006-086"
RESTAURANTE_LAT = "-19.978452"
RESTAURANTE_LNG = "-43.932128"
RESTAURANTE_TELEFONE = "+5531984428765"

# TELEFONE DE TESTE — substitui o do cliente em TODO pedido marcado como
# teste. O Uber manda SMS de acompanhamento para o número do destino: sem
# esta troca, um teste nosso vira mensagem estranha no celular de um cliente
# real, e quem está testando não recebe aviso nenhum.
TELEFONE_TESTE = "+5531973065499"

CARDAPIO_WEB_HEADER = "x-webhook-token"
# A conta do Villa Deli só tem credencial de PRODUÇÃO no Cardápio Web (o mesmo
# token dá 401 no sandbox deles). Homologação aponta para a base real de
# propósito: é assim que os pedidos de verdade da loja chegam aqui para teste.
# Continua seguro porque quem entrega é decidido pelo MODO DE OPERAÇÃO — em
# teste, o Uber acionado é o de sandbox e nada é cobrado.
CARDAPIO_WEB_BASE_URL = "https://integracao.cardapioweb.com"
CARDAPIO_WEB_MERCHANT_ID = "14875"

UBER_BASE_URL = "https://api.uber.com"
UBER_AUTH_URL = "https://auth.uber.com/oauth/v2/token"
# Escopos OAuth2. Pedir um escopo que a aplicacao NAO tem derruba o token
# inteiro (invalid_scope). Quando o Uber liberar entregas para a sua
# aplicacao, troque para: "direct.organizations eats.deliveries"
UBER_SCOPE = "direct.organizations"
UBER_CUSTOMER_ID = "551fca94-17d0-4acf-a3f8-05d93a0abe6a"
# A conta de teste tem o produto de entregas liberado; a de produção ainda não.
UBER_SCOPE_TESTE = "direct.organizations eats.deliveries"
UBER_BASE_URL_TESTE = "https://sandbox-api.uber.com"
UBER_CUSTOMER_ID_TESTE = "c1cc78e9-6147-5db8-82be-1b0f45446e09"

IFOOD_BASE_URL = "https://merchant-api.ifood.com.br"
IFOOD_BASE_URL_TESTE = "https://merchant-api.ifood.com.br"
IFOOD_MERCHANT_ID = ""
NOVA99_BASE_URL = "https://api.99app.com"
NOVA99_BASE_URL_TESTE = "https://api.99app.com"
NOVA99_AUTH_URL = "https://api.99app.com/oauth/token"


# ===========================================================================
# PRODUÇÃO  —  npx wrangler deploy --env producao
#
# Só publique aqui depois que a tela de Configurações do painel estiver toda
# verde em HML. Corrida criada neste ambiente é cobrada de verdade.
# ===========================================================================
[env.producao]
name = "hub-logistico"

[[env.producao.d1_databases]]
binding = "DB"
database_name = "hub-logistico"
database_id = "6b63b291-8a9f-467c-964b-082a2500ad2c"

[[env.producao.kv_namespaces]]
